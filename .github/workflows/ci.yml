name: CI

on:
  pull_request:
  push:
    branches: ["main", "master"]

jobs:
  go-test:
    name: Go Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-go
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Run Go tests
        run: go test ./...

  python-test:
    name: Python Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-module
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Python unit tests
        run: PYTHONPATH=${{ github.workspace }}/ai-module python -m unittest discover -s tests -p 'test_*.py'

  docker-build-check:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [go-test, python-test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend-go image
        uses: docker/build-push-action@v6
        with:
          context: ./backend-go
          file: ./backend-go/Dockerfile
          push: false

      - name: Build ai-module image
        uses: docker/build-push-action@v6
        with:
          context: ./ai-module
          file: ./ai-module/Dockerfile
          push: false